<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta — SafeBite</title>
  <link rel="icon" href="../../Images/favicon.ico">
  <link rel="stylesheet" href="../../Estilos/cadastro.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="tela-cadastro">

  <a href="inicio.html" class="btn-voltar">← Voltar</a>

  <!-- Painel esquerdo: imagem -->
  <div class="panel-image">
    <img src="../../Images/Imagem1.jpg" alt="Cozinha" />
    <div class="panel-image-overlay"></div>
  </div>

  <!-- Painel direito: formulário -->
  <div class="panel-form">
    <div class="form-card">

      <div class="form-logo">
        <img src="../../Images/logo.png" alt="SafeBite" />
      </div>

      <h1 class="form-title">Crie sua conta</h1>
      <p class="form-subtitle">Comece sua jornada para uma alimentação mais segura e personalizada hoje mesmo.</p>

      <form id="form-cadastro">

        <div class="field">
          <label class="field-label" for="nome">Nome completo</label>
          <div class="input-group">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="nome" placeholder="Ex: Ana Silva" required />
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="email">E-mail</label>
          <div class="input-group">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="email" placeholder="ana.silva@exemplo.com" required />
          </div>
        </div>

        <div class="fields-row">
          <div class="field" style="margin-bottom:0">
            <label class="field-label" for="senha">Senha</label>
            <div class="input-group">
              <i class="fa-solid fa-lock"></i>
              <input type="password" id="senha" placeholder="••••••••" required />
            </div>
          </div>
          <div class="field" style="margin-bottom:0">
            <label class="field-label" for="confirmar">Confirmar Senha</label>
            <div class="input-group">
              <i class="fa-solid fa-lock"></i>
              <input type="password" id="confirmar" placeholder="••••••••" required />
            </div>
          </div>
        </div>

        <div style="margin-bottom: 16px;"></div>

        <div class="info-box">
          <i class="fa-solid fa-circle-info"></i>
          <p><strong>PRÓXIMO PASSO</strong><br>
          Após o cadastro, você definirá suas <strong>restrições alimentares</strong> para personalizarmos sua experiência.</p>
        </div>

        <label class="check-label">
          <input type="checkbox" id="tem-restricao" />
          Eu concordo com os <a href="#">Termos de Serviço</a> e a <a href="#">Política de Privacidade</a> do SafeBite.
        </label>

        <button type="submit" class="btn-submit">Criar minha conta →</button>

        <hr class="divider">

        <p class="login-link">Já tem uma conta? <a href="login.html">Entrar agora</a></p>

      </form>
    </div>
  </div>

  <!-- Scripts necessários -->
  <script src="../../Script/config.js"></script>
  <script src="../../Script/routes.js"></script>
  <script src="../../Script/api.service.js"></script>
  <script src="../../Script/utils.js"></script>
  <script src="../../Script/cadastro.js"></script>
</body>
</html>
